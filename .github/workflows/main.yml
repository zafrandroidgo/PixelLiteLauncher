
name: Build Pixel Lite APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "Android SDK: $ANDROID_HOME"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      
      
      - name: Download Gradle manually
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gradle"

          curl -fL \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 15 \
            --connect-timeout 30 \
            --max-time 900 \
            https://downloads.gradle.org/distributions/gradle-8.7-bin.zip \
            -o "$RUNNER_TEMP/gradle/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle/gradle.zip" \
            -d "$RUNNER_TEMP/gradle"

          echo "$RUNNER_TEMP/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        run: gradle --version


      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelLiteLauncher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
